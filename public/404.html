<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Richard Prince</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #0A0A0A; color: #D4D4D4; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .container { max-width: 480px; text-align: left; }
    .eyebrow { color: #737373; font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 24px; display: flex; align-items: center; gap: 16px; }
    .eyebrow::before { content: ''; width: 32px; height: 1px; background: #737373; opacity: 0.4; }
    h1 { font-size: 64px; font-weight: 600; color: #FFFFFF; margin: 0 0 16px; line-height: 1.05; letter-spacing: -0.02em; }
    p { font-size: 16px; color: #D4D4D4; line-height: 1.6; margin: 0 0 32px; }
    a { display: inline-flex; align-items: center; gap: 12px; padding: 12px 24px; background: #D4A843; color: #0A0A0A; text-decoration: none; border-radius: 4px; font-weight: 500; font-size: 14px; transition: opacity 0.2s; }
    a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="eyebrow">404</div>
    <h1>Page not found</h1>
    <p>This page doesn't exist or has moved. Head back home and find what you're looking for.</p>
    <a href="/">← Back to Portfolio</a>
  </div>
</body>
</html>
